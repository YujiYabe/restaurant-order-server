  # placeStatusOpening  = 1; // 店頭で席を確保する 開始前の状況
  # placeStatusUsing    = 2; // オーダー可能状況
  # placeStatusBilling  = 3; // 支払い中
  # placeStatusStopping = 4; // 停止中



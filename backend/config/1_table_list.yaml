# 説明。 
# Xn                          場所の名前。 
  # capacity    : 4           場所の収容人数。この人数によってチャージ料金が変わる。 
  # place_group : "X"         場所のグループ名。 収容人数毎のグループと配置による。 
  # place_name  : "A1"        場所の 名前 
  # place_status: 1           場所のステータス システムで変更可能 
  # line_number : 0           場所が使用可能ステータスに変更される都度インクリメントされる。日付が変わるとリセットされる
  # customer_id : 3178601000  スマレジ側の精算時ひも付け番号。
  #                           郵便番号 3178601  
  #                           店番号   0        0〜9  同じ郵便番号内の住所で最大10店
  #                           席番号   00      00〜99 1店舗内で最大100席
  # place_status 一覧

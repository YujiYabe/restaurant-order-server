{{define "signboard"}}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/image/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
  <link type="text/css" rel="stylesheet" href="/fontawesome/css/all.min.css" />
  <link type="text/css" rel="stylesheet" href="/css/common.css?v={{ .Version }}" media="all" />


  <style>
    .object-fit-cover {
      object-fit: cover;
      /* アスペクト比を保ちつつカラム内いっぱいに表示 */
      height: 200px;
      /* 適当な高さを指定(必要に応じて変更) */
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .full-height {
      height: 100%;
    }
  </style>
  <title>サインボード</title>
</head>

<body x-data="restaurantOrderServerPage" class="body_colors vh-100 " style="background-color: #cfe2ff;">

  <div id="kind" name="signboard"></div>
  <div id="url" name="{{ .URL }}"></div>
  <div id="version" name="{{ .Version }}"></div>

  <div id="charge_base_capacity" name=""></div>
  <div id="customer_id" name=""></div>

  <div id="status" name=""></div>
  <div id="mini_product_map" style="display: none;">{{ .MiniProductMap }}</div>
  <div id="signboard_product" style="display: none;">{{ .SignboardProduct }}</div>




  <div class=""></div>
  <div class="row full-height align-items-center justify-content-start">

    <div class="col-4 d-flex flex-column justify-content-start align-items-center">
      <img id="image0" src="" class="img-fluid w-100 mb-2" alt="Image 3">
      <div id="name0"></div>
      <div id="price0"></div>
    </div>
    <div class="col-4 d-flex flex-column justify-content-start align-items-center">
      <img id="image1" src="" class="img-fluid w-100 mb-2" alt="Image 1">
      <div id="name1"></div>
      <div id="price1"></div>
    </div>
    <div class="col-4 d-flex flex-column justify-content-start align-items-center">
      <img id="image2" src="" class="img-fluid w-100 mb-2" alt="Image 2">
      <div id="name2"></div>
      <div id="price2"></div>
    </div>
  </div>
  </div>





  <script type="text/javascript" src="/js/external/cash.min.js"></script>
  <script type="text/javascript" src="/js/external/qrcode.min.js"></script>
  <script src="/js/alpine_app.js?v={{ .Version }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script type="text/javascript" src="/js/lang_set.js?v={{ .Version }}"></script>
  <script type="text/javascript" src="/js/common.js?v={{ .Version }}"></script>
  <script type="text/javascript" src="/js/signboard.js?v={{ .Version }}"></script>

</body>

</html>
{{end}}

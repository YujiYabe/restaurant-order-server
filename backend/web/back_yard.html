{{define "backYard"}}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/image/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
  <link type="text/css" rel="stylesheet" href="/fontawesome/css/all.min.css" />
  <link type="text/css" rel="stylesheet" href="/css/common.css?v={{ .Version }}" media="all" />
  <style>
  </style>
  <title>back_yard {{ .PlaceName }}</title>
</head>

<body x-data="restaurantOrderServerPage">
  <div id="kind" name="back_yard"></div>
  <div id="place_name" name="{{ .PlaceName }}"></div>
  <div id="environment" name="{{ .Environment }}"></div>
  <div id="url" name="{{ .URL }}"></div>
  <div id="version" name="{{ .Version }}"></div>

  <div id="mini_product_map" style="display: none;">{{ .MiniProductMap }}</div>
  <div id="body_using" class="screen vh-100">

    <div class="vh-100">
      <div class=" row h-10Per">

        <div class=" col-1"> </div>

        <div class="col-10 container text-center row  alert alert-primary  border-white">

          <div class="row col-12">
            <div class="rounded page-title text-center col-2 alert alert-warning" id="line_number"> </div>
            <div class="rounded-pill page-title text-center col-2 alert alert-light background-white"
              onclick="changeStatus(this)" id="0">
              <i class="fas fa-broom"></i>
              掃除中
            </div>

            <div class="rounded-pill page-title text-center col-2 alert alert-light background-white"
              onclick="changeStatus(this)" id="1">
              <i class="fas fa-lock-open"></i>
              待機中
            </div>

            <div class="rounded-pill page-title text-center col-2 alert alert-light background-white"
              onclick="changeStatus(this)" id="2">
              <i class="fas fa-lock"></i>
              利用中
            </div>

            <div class="rounded-pill page-title text-center col-2 alert alert-light background-white"
              onclick="changeStatus(this)" id="3">
              <i class="fas fa-money-bill"></i>
              支払中
            </div>

            <div class="rounded-pill page-title text-center col-2 alert alert-light background-white"
              onclick="changeStatus(this)" id="4">
              <i class="fas fa-ban"></i>
              停止中
            </div>
          </div>

          <!-- 注文履歴・会計 -->
          <div id="body_history" class="page-body container row h-80Per">

            <div id="order_history" class="col-12 row alert alert-primary border-white mx-0  overflow-y-scroll h-80Per">
            </div>

          </div>

        </div>


        <div class=" col-1"> </div>
      </div>


    </div>

    {{ template "Modal" .}}


  </div>



  <script src="/js/external/cash.min.js"></script>
  <script src="/js/alpine_app.js?v={{ .Version }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script src="/js/common.js?v={{ .Version }}"></script>
  <script src="/js/back_yard.js?v={{ .Version }}"></script>
  <script src="/js/sse.js?v={{ .Version }}"></script>
</body>

</html>
{{end}}

{{define "internet"}}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/image/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
  <link type="text/css" rel="stylesheet" href="/fontawesome/css/all.min.css" />
  <link type="text/css" rel="stylesheet" href="/css/common.css?v={{ .Version }}" media="all" />


  <style>
    .text_decoration {
      text-decoration: underline;
    }
  </style>
  <title>internet</title>
</head>

<body x-data="restaurantOrderServerPage" class="body_colors vh-100 " style="background-color: #cfe2ff;">

  <div id="kind" name="internet"></div>
  <div id="place_name" name="{{ .PlaceName }}"></div>

  <div id="store_id" name="{{ .StoreID }}"></div>
  <div id="environment" name="{{ .Environment }}"></div>
  <div id="store_name" name="{{ .StoreName }}"></div>
  <div id="store_address" name="{{ .StoreAddress }}"></div>
  <div id="commission" name="{{ .Commission }}"></div>
  <div id="charge_base_price" name="{{ .ChargeBasePrice }}"></div>
  <div id="is_permit_alcohol" name="{{ .IsPermitAlcohol }}"></div>
  <div id="permission" name=""></div>
  <div id="version" name="{{ .Version }}"></div>
  <div id="url" name="{{ .URL }}"></div>
  <div id="version" name="{{ .Version }}"></div>

  <div id="charge_base_capacity" name=""></div>
  <div id="customer_id" name=""></div>

  <div id="status" name=""></div>
  <div id="mini_product_map" style="display: none;">{{ .MiniProductMap }}</div>
  <div id="tag_list" style="display: none;">{{ .TagList }}</div>

  <!-- ================================================= -->
  <div id="body_cleaning" class="screen vh-100 internet-top bg-info-subtle font-70px ">
    <br>
    <p class="text-center">ただいま清掃中です。</p>
    <br>
  </div>

  <!-- ================================================= -->
  <div id="body_opening" class="screen vh-100 internet-top bg-info-subtle font-70px ">
    <br>
    <p class="text-center">{{ .PlaceName }}</p>
    <p class="text-center">ご利用可能です。</p>
    <p class="text-center">受付モニターから席を確保してください。</p>
  </div>

  <!-- ================================================= -->
  <div id="body_billing" class="screen vh-100 internet-top bg-info-subtle " style="display: block">
    <br>
    <br>
    <br>
    <br>
    <div class="text-center">ご利用ありがとうございました。</div>
    <br>
    <div class="text-center">こちらのコードにて会計をお願いいたします。</div>
    <hr>
    <div id="image_qr" class="text-center border-white "> </div>
  </div>

  <!-- ================================================= -->
  <div id="body_stopping" class="screen internet-top bg-info-subtle font-70px ">
    ただいまご利用できません。
  </div>



  <!-- ================================================= -->
  <div id="body_using" class="screen body_colors  ">
    <div id="thanksMessage" class=" fixed-top text-center alert alert-danger" style="display: none;" role="alert">
      <div>
        <strong>ご注文ありがとうございました</strong>
      </div>
    </div>


    <div class="">
      <div class=" row ">
        <div class="col-12 container text-center row mx-0 mb-0 alert alert-primary  border-white p-0">
          <div class="row col-12 mx-0">
            <div class="col-3 rounded page-title text-center alert alert-warning row mx-0 p-0">
              <div class="col-12 pt-2 badge bg-info" id="line_number"></div>
              <div class="col-12 " id="enter_time">0</div>
            </div>

            <div class="col-9 rounded page-title text-center alert alert-warning row mx-0 p-0">
              <!-- <div class="col-6 pt-2 badge bg-info">チャージ金額</div> -->
              <div class="col-12 pt-2 badge bg-info">会計金額</div>
              <!-- <div class="col-6 " id="diff_price">0</div> -->
              <div class="col-12 " id="place_price">0</div>
            </div>
          </div>

        </div>

        <div id="debug_table" style="display: none;"></div>


        <div id="body_tablet" class="page-body h-80Per mx-0">
          <div class=" mb-0 row">
            <div class="select_div pe-0">
              <select id="tag_primary" class="form-select form-select-lg tag_primary_class "
                onchange="selectTagPrimary()"></select>
            </div>
            <div class="select_div ps-0">
              <select id="tag_secondary" class="form-select form-select-lg" onchange="selectTagSecondary()"></select>
            </div>
          </div>

          <div id="menu_content"
            class=" text-center col-12 alert alert-primary border-0 overflow-y-scroll row m-0 px-0 ">
            <div id="stock_none" class="col-12 h1 ">
              ただいま提供できません🙇🏻
            </div>


          </div>
        </div>

        <!-- 会計後にQRコードを表示して座席票の代わりにする -->
        <div id="billing_qr" class="page-body container row h-80Per" style="display: none;">
        </div>

      </div>
    </div>


  </div>


  {{ template "ModalInternet" .}}
  </div>

  <script type="text/javascript" src="/js/external/cash.min.js"></script>
  <script type="text/javascript" src="/js/external/qrcode.min.js"></script>
  <script src="/js/alpine_app.js?v={{ .Version }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script type="text/javascript" src="/js/lang_set.js?v={{ .Version }}"></script>
  <script type="text/javascript" src="/js/common.js?v={{ .Version }}"></script>
  <script type="text/javascript" src="/js/internet.js?v={{ .Version }}"></script>
  <script type="text/javascript" src="/js/sse.js?v={{ .Version }}"></script>

</body>

</html>
{{end}}

{{define "waiter"}}

<link rel="manifest" href="/js/waiter-manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        if ('{{ .Environment }}' === 'local') {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
          return;
        }

        await navigator.serviceWorker.register('/js/waiter-service-worker.js');

        const params = new URLSearchParams(window.location.search);
        const deviceKey = params.get('device_key');

        if (deviceKey) {
          const cache = await caches.open('restaurant-order-server-cache-v5');
          const dynamicURL = `/v1/monitor/waiter?device_key=${deviceKey}`;
          await cache.add(dynamicURL);
          console.log(`動的URLをキャッシュしました: ${dynamicURL}`);
        }
      } catch (error) {
        console.error('Service Workerの初期化に失敗しました:', error);
      }
    });
  }

</script>

<head>

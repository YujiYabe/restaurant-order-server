{{define "reception"}}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/image/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
  <link type="text/css" rel="stylesheet" href="/fontawesome/css/all.min.css" />
  <link type="text/css" rel="stylesheet" href="/css/common.css?v={{ .Version }}" media="all" />
  <style>
  </style>
  <title>reception</title>
</head>

<body x-data="restaurantOrderServerPage">
  <div id="kind" name="reception"></div>
  <div id="place_name" name="0"></div>

  <div id="store_id" name="{{ .StoreID }}"></div>
  <div id="environment" name="{{ .Environment }}"></div>
  <div id="store_name" name="{{ .StoreName }}"></div>
  <div id="store_address" name="{{ .StoreAddress }}"></div>
  <div id="commission" name="{{ .Commission }}"></div>
  <div id="charge_base_price" name="{{ .ChargeBasePrice }}"></div>
  <div id="is_permit_alcohol" name="{{ .IsPermitAlcohol }}"></div>
  <div id="is_enable_charge" name="{{ .IsEnableCharge }}"></div>
  <div id="url" name="{{ .URL }}"></div>
  <div id="version" name="{{ .Version }}"></div>



  <div class=" container row max-width-100per " style="display: none;">
    <div class="col-1 "></div>
    <div class=" alert alert-success text-center col-10 border-white h3 mb-0 ">
      {{ .OpenTime }}
    </div>
    <div class="col-1 "></div>
  </div>

  <hr>

  <div class=" container row max-width-100per ">
    <div class="col-1 "></div>

    <div id="store_explain" class="col-10 px-0">

      <!-- 説明 ------------------------------------------------ -->
      <div id="explain_div" class=" container px-0 " style="display: none;">
        <div class="alert alert-warning border-white mb-0 ">
          <h4>
            当店はセルフオーダー・セルフ調理・セルフ会計のお店です。
            </h3>
            <h6>
              ご注文の商品は調理せずにお届けになります。
            </h6>
            <h6>
              お客様は備え付けの電子レンジで<strong class="text_decoration ">ご自身で調理願います</strong>。
            </h6>

        </div>
      </div>
    </div>
    <div class="col-1 "></div>

    <div class="col-1 "></div>

    <div id="icon_status" class="col-10 ps-0 mb-0 px-0">

      <div id="head_div"></div>
      <!-- 座席表 ------------------------------------------------ -->
      <div id="body_div" class="  "></div>

    </div>


    <div class="col-1 "></div>

  </div>

  <hr id="border">
  <!--  ------------------------------------------------ -->

  <div id="icon_explain" class=" container row max-width-100per ">
    <div class=" col-1  ">
    </div>
    <div class=" col-10 alert alert-success text-center border-white mx-0 ">
      アイコン説明
    </div>
    <div class=" col-1 ">
    </div>

    <div class=" col-1 ">
    </div>

    <div class="rounded-pill text-center border-1 col-2 alert alert-secondary border-white px-0 ">
      <div class="fas fa-broom"> 清掃中</div>
    </div>

    <div class="rounded-pill text-center border-1 col-2 alert alert-light border-info px-0 ">
      <div class="fas fa-lock-open"> 利用可</div>
    </div>

    <div class="rounded-pill text-center border-1 col-2 alert alert-secondary border-white px-0 ">
      <div class="fas fa-lock"> 利用中</div>
    </div>

    <div class="rounded-pill text-center border-1 col-2 alert alert-secondary border-white px-0 ">
      <div class="fas fa-money-bill"> 支払中</div>
    </div>

    <div class="rounded-pill text-center border-1 col-2 alert alert-secondary border-white px-0 ">
      <div class="fas fa-ban"> 停止中</div>
    </div>

  </div>

  {{ template "Modal" .}}


  <script src="/js/external/cash.min.js"></script>
  <script src="/js/alpine_app.js?v={{ .Version }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script src="/js/common.js?v={{ .Version }}"></script>
  <script src="/js/reception.js?v={{ .Version }}"></script>
  <script src="/js/sse.js?v={{ .Version }}"></script>
</body>

</html>
{{end}}
